name: Build BGSnowballEngine

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download Latest HDT
      shell: pwsh
      run: |
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/HearthSim/Hearthstone-Deck-Tracker/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -match "Hearthstone\.Deck\.Tracker-.*\.zip" } | Select-Object -First 1
        Write-Host "Downloading HDT from $($asset.browser_download_url)"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "hdt.zip"
        Expand-Archive -Path "hdt.zip" -DestinationPath "temp_hdt" -Force
        New-Item -ItemType Directory -Force -Path "lib"
        Move-Item -Path "temp_hdt\Hearthstone Deck Tracker\*" -Destination "lib\" -Force

    - name: Restore and Build Plugin
      run: msbuild BGSnowballEngine.csproj -restore -p:Configuration=Release

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BGSnowballEngine_Release
        path: |
          bin/Release/BGSnowballEngine.dll
          Patch36.2_Meta.json
