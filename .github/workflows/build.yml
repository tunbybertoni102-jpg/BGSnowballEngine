name: Build BGSnowballEngine

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build Plugin
      run: dotnet build BGSnowballEngine.csproj -c Release

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BGSnowballEngine_Release
        path: |
          bin/Release/BGSnowballEngine.dll
          Patch36.2_Meta.json
