name: Build BGSnowballEngine

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore and Build Plugin
      run: msbuild BGSnowballEngine.csproj -restore -p:Configuration=Release

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BGSnowballEngine_Release
        path: |
          bin/Release/BGSnowballEngine.dll
          Patch36.2_Meta.json
